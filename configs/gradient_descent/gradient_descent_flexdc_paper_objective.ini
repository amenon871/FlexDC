; ADDED by condor_flexdc_v4 pilot agent (2026-07-10). New file — no existing
; config modified. Copy of gradient_descent.ini with the cost constants set to
; the FlexDC-paper objective used by the pilot dataset lineage (handoff §4):
;   Ctrack = psi1 * softplus(psi2 * (eps90 - gamma)); psi1=1, psi2=10, gamma=0.3
;   CQoS   = beta * sum_j softplus(rho * (Pj - delta)); beta=20, rho=2, delta=0.1
; The wizard uses these ONLY for its diagnostic cost columns; the authoritative
; objective is reconstructed independently from raw metrics during validation.

[general_variables]
initP         = 1.0
initR         = 0.6

[run_simulator]

[calculate_delay_prob]
fitdown       = 0.85
fitup         = 0.95

[calculate_gradient]
gamma         = 0
kwh           = 3600000
QOS_THRESHOLD = 0.1
eta           = 0.5
tau           = 46
ysigma        = 0.4
Tst           = 60
mst           = 1
psi1          = 1
; psi2: how steep the cost is after tracking constraint is violated
psi2          = 10
TRACKING_ERROR_CONSTRAINT = 0.3
dEdR          = 0

[gradient_driver]
beta          = 20
rho           = 2
w_step_up     = 0.0002
w_step_down   = 0.0002
PRup          = 1200
PRdown        = 400
wmin          = 0.01
kappa         = 0.01
phi           = 1000000
limit_decrease= 200
num_iterations= 200

[dr_program]
program_type = RSR
