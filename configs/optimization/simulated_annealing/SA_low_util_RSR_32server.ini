[initialization]
p_init  = 1.15
r_init  = 0.2

[simulated_annealing]
temperature     = 1000
cooling_rate    = 0.95
max_iter        = 400
smart_weight    = True

[boundaries]
p_low   = 0.9
p_high  = 1.2
r_low   = 0.2
r_high  = 0.8
w_low   = 0.1
w_high  = 0.5

[step_size]
r_step  = 0.01
p_step  = 0.01
w_step  = 0.01

[cost_function]
; psi1 and psi2: tracking error SoftPlus coefficients
psi1    = 20
psi2    = 20
tracking_error_constraint = 0.3

; beta and rho: QoS SoftPlus function coefficients
beta    = 1.5
rho     = 5
qos_constraint = 0.1

[dr_program]
; DR Program Type: options [EDR, RSR]
program_type = RSR
