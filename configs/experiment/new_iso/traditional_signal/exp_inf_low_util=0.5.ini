[system]
;Control step seconds of the simulator
time_granularity = 1
;random_seed for randomness
random_seed = 20
;Length of the simulation in seconds
simulation_duration = 3600
;Expected utilization ratio (or target utilization for simulation runs)
utilization = 0.5
;Average idle power for all nodes
idle_watts = 120.0
;Number of servers
server_count = 1000

[iso]
;Boolean to normalize iso signal
normalize_iso_signal = True
;Boolean to randomize the start time of iso signal
randomize_iso_start = False
;ISO signal granularity in seconds
iso_signal_granularity = 2
;ISO signal start offset in hours
iso_signal_start_hour = 16
;file path for ISO24h.csv
iso_file_path = ../../data/1-17-2025_traditional.csv