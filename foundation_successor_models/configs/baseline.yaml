first_validation_min_seconds: 300
checkpoint_margin_seconds: 30
log_every_steps: 10
eval_batch_size: 2048
loss:
  qos_weight: 4.0
  tracking_boundary_multiplier: 2.0
  qos_boundary_multiplier: 2.0
cpu_threads: 4
model:
  dim_job_mix: 13
  dim_dc_features: 14
  st_dim_hidden: 512
  st_num_heads: 4
  st_num_outputs: 1
  global_projection_dim: 128
  linear_dim_hidden: 512
