[general_variables]
initP         = 1.0
initR         = 0.6

[run_simulator]

[calculate_delay_prob]
fitdown       = 0.85
fitup         = 0.95

[calculate_gradient]
gamma         = 0
kwh           = 3600000
QOS_THRESHOLD = 0.1
eta           = 0.5
tau           = 46
ysigma        = 0.4
Tst           = 60
mst           = 1
psi1          = 8
; psi2: how steep the cost is after tracking constraint is violated
psi2          = 1
TRACKING_ERROR_CONSTRAINT = 0.3
dEdR          = 0

[gradient_driver]
beta          = 0.5
rho           = 2
w_step_up     = 0.0002
w_step_down   = 0.0002
PRup          = 1200
PRdown        = 400
wmin          = 0.01
kappa         = 0.01
phi           = 1000000
limit_decrease= 200
num_iterations= 200

[dr_program]
program_type = RSR
