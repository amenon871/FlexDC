[metadata]
name = peacsim
version = 0.0.1
author = Fatih Acun
author_email = acun@bu.edu
description = A data center simulator to evaluate scheduling, power management, and electricity bidding strategies that operate as part of demand response policies.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/peaclab/flexdc-sim
project_urls =
    Bug Tracker = https://github.com/peaclab/flexdc-sim/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =
    pandas
    numpy
    tqdm

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    peacsim = peacsim.cli:main